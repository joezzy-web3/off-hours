# Netlify reads this file. No settings need entering by hand.
[build]
  command = "npm run build:netlify"
  publish = "dist/web"
  # The agent commits new data every hour. Those commits change nothing the site is
  # built from (the page reads live data straight from GitHub), so skip the build for them.
  # A first build, or a rebuild of the same commit, always runs.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src api netlify scripts public package.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# One function serves every server route. It is bundled by the build command.
[functions]
  directory = "dist/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
