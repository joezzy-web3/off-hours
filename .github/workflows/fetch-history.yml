# Records Bitget's hourly candle history into data/. Run it by hand:
# Actions tab, "fetch-history", "Run workflow". It needs no secrets.
name: fetch-history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-history.mjs
      - name: Commit the record
        run: |
          git config user.name "data-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Record Bitget hourly history"
          git pull --rebase
          git push
