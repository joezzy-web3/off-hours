# Every hour, records the spread and resting depth of each contract into
# data/book/. This is the only record of what off-hours trading costs, and it
# cannot be back-filled, so it starts as soon as this file is in the repository.
name: record-book
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/record-book.mjs
      - name: Commit the record
        run: |
          git config user.name "data-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Record order books"
          git pull --rebase
          git push
